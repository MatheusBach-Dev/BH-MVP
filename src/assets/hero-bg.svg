<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="glow1" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="800" fill="#0A0A0A"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0,200,83,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Main glow layers -->
  <ellipse cx="840" cy="320" rx="500" ry="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="780" cy="440" rx="300" ry="240" fill="url(#glow2)" filter="url(#blur2)"/>
  <ellipse cx="240" cy="640" rx="360" ry="280" fill="url(#glow3)" filter="url(#blur1)"/>

  <!-- Right panel frame suggestion -->
  <rect x="630" y="80" width="510" height="640" rx="24" fill="rgba(255,255,255,0.015)" stroke="rgba(0,200,83,0.12)" stroke-width="1"/>

  <!-- Inner panel glow -->
  <rect x="650" y="100" width="470" height="600" rx="18" fill="rgba(0,200,83,0.03)"/>

  <!-- Corner accents -->
  <path d="M630 104 L630 80 L654 80" fill="none" stroke="rgba(0,200,83,0.5)" stroke-width="1.5"/>
  <path d="M1116 80 L1140 80 L1140 104" fill="none" stroke="rgba(0,200,83,0.5)" stroke-width="1.5"/>
  <path d="M630 696 L630 720 L654 720" fill="none" stroke="rgba(0,200,83,0.5)" stroke-width="1.5"/>
  <path d="M1116 720 L1140 720 L1140 696" fill="none" stroke="rgba(0,200,83,0.5)" stroke-width="1.5"/>

  <!-- Decorative dots grid inside panel -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="rgba(0,200,83,0.15)"/>
  </pattern>
  <rect x="650" y="100" width="470" height="600" rx="18" fill="url(#dots)"/>

  <!-- Horizontal lines left side -->
  <line x1="60" y1="200" x2="260" y2="200" stroke="rgba(0,200,83,0.08)" stroke-width="1"/>
  <line x1="60" y1="220" x2="180" y2="220" stroke="rgba(0,200,83,0.05)" stroke-width="1"/>
  <line x1="60" y1="560" x2="200" y2="560" stroke="rgba(0,200,83,0.08)" stroke-width="1"/>
  <line x1="60" y1="580" x2="140" y2="580" stroke="rgba(0,200,83,0.05)" stroke-width="1"/>

  <!-- Scanline on panel -->
  <line x1="650" y1="340" x2="1120" y2="340" stroke="rgba(0,200,83,0.06)" stroke-width="1"/>
  <line x1="650" y1="460" x2="1120" y2="460" stroke="rgba(0,200,83,0.04)" stroke-width="1"/>

  <!-- Top fade -->
  <rect width="1200" height="120" fill="url(#fadeTop)"/>
  <defs>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect y="680" width="1200" height="120" fill="url(#fadeBottom)"/>
</svg>
